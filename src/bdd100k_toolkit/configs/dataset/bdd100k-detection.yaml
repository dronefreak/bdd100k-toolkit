# dataset/bdd100k-detection.yaml
# Hydra `dataset` config group entry for BDD100K object detection, produced
# by src/bdd100k_toolkit/detection/datasets/bdd100k.py.
#
# Prepare with:
#   bdd100k-prepare --dataset bdd100k-detection \
#       --raw-dir <BDD100K_raw_dir> --output-dir <canonical_coco_out>
#   bdd100k-coco-to-yolo \
#       --input-dir <canonical_coco_out> --output-dir <yolo_out>
#
# `dataset_yaml` (YOLO) and `dataset_dir` (RF-DETR) are required only by the model that
# uses them and have no default (Hydra `???`): pass them on the command line, e.g.
# `dataset.dataset_yaml=/path/to/...`.
name: bdd100k-detection
dataset_yaml: ???  # YOLO data.yaml (YOLO models)
dataset_dir: ???  # canonical COCO root (RF-DETR models)
num_classes: 10
eval_split: test
