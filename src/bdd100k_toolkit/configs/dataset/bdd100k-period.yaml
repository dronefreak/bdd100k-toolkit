# dataset/bdd100k-period.yaml
# Hydra `dataset` config group entry for BDD100K time-of-day (period)
# classification, derived from the official label release's
# `attributes.timeofday` field (see
# src/bdd100k_toolkit/classification/datasets/period.py and
# _bdd100k_common.py for the derivation and raw_dir layout).
#
# Prepare with:
#   bdd100k-prepare --dataset bdd100k-period \
#       --raw-dir <BDD100K_raw_dir> --output-dir <canonical_out>
#
# `data_dir` is required and has no default (Hydra `???`): pass it on the command
# line, e.g. `dataset.data_dir=/path/to/...`.
name: bdd100k-period
data_dir: ???
num_classes: 3
eval_split: test
