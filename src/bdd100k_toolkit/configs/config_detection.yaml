# Base Hydra config for `bdd100k-train`.
#
# Compose with a `dataset=<key>` override (see configs/dataset/) and a
# `model.name=<ultralytics-detection-checkpoint>` override, e.g.:
#   bdd100k-train dataset=bdd100k-detection model.name=yolo11n

defaults:
  - dataset: bdd100k-detection
  - _self_

model:
  name: yolo11n
  num_classes: ${dataset.num_classes}

# Defaults are a reasoned starting point for BDD100K (not a tuned result):
#   * 59k train / 10k valid / 10k test, all 1280x720, about 18 boxes per image.
#   * Small objects: traffic lights and signs are 33% of the boxes and mostly tiny
#     (DetectionBench measured 55% of all boxes under 16 px at imgsz 640, 35% at
#     960, 21% at 1280), so 960 is a compromise between accuracy and speed.
#   * Strong imbalance (car 55% of boxes, only 113 `train` boxes in the train split),
#     so rare-class AP is noisy.
training:
  dataset_yaml: ${dataset.dataset_yaml}
  epochs: 50
  batch_size: -1  # -1 = Ultralytics AutoBatch (about 60% of GPU memory)
  lr: 0.01  # lr0; used because the optimizer is explicit (`auto` ignores it)
  imgsz: 960
  workers: 8
  patience: 10
  optimizer: SGD
  cos_lr: true
  use_amp: true
  device: auto  # auto = cuda if available, else cpu
  output_dir: experiments/${dataset.name}/${model.name}
  # Extra Ultralytics train() arguments, e.g. +training.extra.fraction=0.1
  extra:
    warmup_epochs: 1.0  # about 930 steps per epoch, so 1 epoch is plenty
    close_mosaic: 10  # last 10 epochs without mosaic (natural dashcam scenes)

evaluation:
  dataset_yaml: ${dataset.dataset_yaml}
  num_classes: ${dataset.num_classes}
  device: ${training.device}
  output_dir: ${training.output_dir}/evaluation
  save_predictions: false
  split: ${dataset.eval_split}
