# Base Hydra config for `bdd100k-train`.
#
# Compose with a `dataset=<key>` override (see configs/dataset/) and a
# `model.name=<ultralytics-cls-checkpoint>` override, e.g.:
#   bdd100k-train dataset=bdd100k-weather model.name=yolo11n-cls

defaults:
  - dataset: bdd100k-weather
  - _self_

model:
  # ultralytics: yolo11n-cls, yolov8s-cls, ...   timm: convnext_tiny, resnet50, ...
  # (the timm backend needs: pip install "bdd100k-toolkit[timm]")
  backend: ultralytics
  name: yolo11n-cls

training:
  epochs: 50
  batch_size: 32
  lr: null  # null = backend default (ultralytics 0.001, timm 3e-4)
  imgsz: 224
  workers: 4
  # Early stopping and best-checkpoint selection (macro_f1 | balanced_accuracy | accuracy),
  # evaluated on `valid` every epoch. patience = epochs without improvement (0 = off).
  monitor: macro_f1
  patience: 20
  # Ultralytics' `auto` picks the optimizer AND ignores lr; set e.g. AdamW to use lr.
  optimizer: auto
  device: auto  # auto = cuda if available, else cpu
  output_dir: experiments/${dataset.name}/${model.name}
  # Extra Ultralytics train() arguments, e.g. +training.extra.fraction=0.1
  # For timm: ema (true), ema_decay (0.999), grad_clip (0 = off), weight_decay,
  # label_smoothing, balance (none|loss|sampler), balance_power, warmup_epochs,
  # pretrained, scale_min, hflip, color_jitter, seed, progress (false = plain
  # per-epoch lines for log files; Ultralytics draws its own bars).
  extra: {}
